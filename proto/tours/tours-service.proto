syntax = "proto3";

option go_package = "proto/tours";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ----------------- SERVIS -----------------
service ToursService {
  // Kreiranje nove ture
  rpc CreateTour(CreateTourRequest) returns (TourResponse) {
    option (google.api.http) = {
      post: "/tours/create-tour"
      body: "*"
    };
  }

  // Preuzimanje svih tura od autora
  rpc GetAuthorTours(GetAuthorToursRequest) returns (GetAuthorToursResponse) {
    option (google.api.http) = {
      get: "/tours/{authorId}"
    };
  }

  // Dobavljanje ture po id
  rpc GetTourById(GetTourByIdRequest) returns (TourResponse) {
    option (google.api.http) = {
      get: "/tours/tour/{id}"
    };
  }

  // Dodavanje ključne tačke na turu
  rpc AddKeyPoint(AddKeyPointRequest) returns (KeyPointResponse) {
    option (google.api.http) = {
      post: "/tours/add-keypoint-grpc"
      body: "*"
    };
  }

  rpc UpdateKeyPoint(UpdateKeyPointRequest) returns (KeyPointResponse) {
    option (google.api.http) = {
      put: "/tours/tour/{tourId}/update-keypoint"
      body: "*"
    };
  }

  rpc DeleteKeyPoint(DeleteKeyPointRequest) returns (DeleteKeyPointResponse) {
    option (google.api.http) = {
      delete: "/tours/tour/{tourId}/keypoint/{keypointId}"
    };
  } 

  // Publishovanje i arhiviranje ture
  rpc UpdateTourStatus(UpdateTourStatusRequest) returns (UpdateTourStatusResponse) {
    option (google.api.http) = {
      patch: "/tours/{tourId}/update-status"
      body: "*"
    };
  }

}

// ----------------- PORUKE -----------------

// Zahtev za kreiranje ture
message CreateTourRequest {
  string name = 1;
  string description = 2;
  string difficulty = 3;
  repeated string tags = 4;
  string authorId = 5; 
}

// Odgovor sa kreiranom turom
message TourResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string difficulty = 4;
  repeated string tags = 5;
  TourStatus status = 6;
  double price = 7;
  string authorId = 8;
  repeated KeyPoint keyPoints = 9; 
  repeated Duration durations = 10;
  double distance = 11;    
  google.protobuf.Timestamp publishedAt = 12;
  google.protobuf.Timestamp archivedAt = 13;  
}

enum TourStatus {
  TOUR_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  PUBLISHED = 2;
  ARCHIVED = 3;
}

enum TransportType {
  TRANSPORT_TYPE_UNSPECIFIED = 0;
  WALKING = 1;
  BIKE = 2;
  CAR = 3;
}

message Duration {
  TransportType mode = 1;
  int32 minutes = 2;
}

// Zahtev za listu tura autora
message GetAuthorToursRequest {
  string authorId = 1;
}

// Odgovor sa listom tura
message GetAuthorToursResponse {
  repeated TourResponse tours = 1;
}

message GetTourByIdRequest {
  string id = 1;
}

message UpdateTourStatusRequest {
  string tourId = 1;
  string authorId = 2;
  TourStatus newStatus = 3;  // Publish ili Archive
}

message UpdateTourStatusResponse {
  string tourId = 1;
  TourStatus status = 2;
  google.protobuf.Timestamp updatedAt = 3;
}

// ----------------- KLJUČNE TAČKE -----------------

message KeyPoint {
  string id = 1;
  string name = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  string imageURL = 6; 
  int32 order = 7;
}

message AddKeyPointRequest {
  string tourId = 1;  // ID ture kojoj se dodaje tačka
  KeyPoint point = 2; // Detalji tačke
}

message KeyPointResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  string imageURL = 6;
  int32 order = 7;
}

message UpdateKeyPointRequest {
  string tourId = 1;
  KeyPoint keyPoint = 2;
  string imageURL = 3; //opciono
}

message DeleteKeyPointRequest {
  string tourId = 1;
  string keypointId = 2;
}

message DeleteKeyPointResponse {
  bool success = 1;
}


