syntax = "proto3";

option go_package = "proto/tours";

import "google/api/annotations.proto";

// ----------------- TOURS SERVIS -----------------
service ToursService {
  // Kreiranje nove ture
  rpc CreateTour(CreateTourRequest) returns (TourResponse) {
    option (google.api.http) = {
      post: "/tours/create-tour"
      body: "*"
    };
  }

  // Preuzimanje svih tura od autora
  rpc GetAuthorTours(GetAuthorToursRequest) returns (GetAuthorToursResponse) {
    option (google.api.http) = {
      get: "/tours/{authorId}"
    };
  }

  // Dobavljanje ture po id
  rpc GetTourById(GetTourByIdRequest) returns (TourResponse) {
    option (google.api.http) = {
      get: "/tours/tour/{id}"
    };
  }

  // Dodavanje ključne tačke na turu
  rpc AddKeyPoint(AddKeyPointRequest) returns (KeyPointResponse) {
    option (google.api.http) = {
      post: "/tours/add-keypoint-grpc"
      body: "*"
    };
  }

  rpc UpdateKeyPoint(UpdateKeyPointRequest) returns (KeyPointResponse) {
    option (google.api.http) = {
      put: "/tours/tour/{tourId}/update-keypoint"
      body: "*"
    };
  }

  rpc DeleteKeyPoint(DeleteKeyPointRequest) returns (DeleteKeyPointResponse) {
    option (google.api.http) = {
      delete: "/tours/tour/{tourId}/keypoint/{keypointId}"
    };
  } 

  // Dobavljanje svih publikovanih tura (za frontend)
  rpc GetPublishedTours(GetPublishedToursRequest) returns (GetPublishedToursResponse) {
    option (google.api.http) = {
      get: "/tours/published"
    };
  }

  rpc GetAllTours(GetAllToursRequest) returns (GetAllToursResponse) {
      option (google.api.http) = {
        get: "/tours/all"
      };
    }
  rpc StartTour(StartTourRequest) returns (StartTourResponse) {
    option (google.api.http) = {
      post: "/tours/start-tour"
      body: "*"
    };
  }

  rpc LeaveTour(LeaveTourRequest) returns (LeaveTourResponse) {
    option (google.api.http) = {
      post: "/tours/leave-tour"
      body: "*"
    };
  }

  // Obaveštavanje backend-a da je korisnik blizu ključne tačke
  rpc NotifyNearKeyPoint(NotifyNearKeyPointRequest) returns (NotifyNearKeyPointResponse) {
    option (google.api.http) = {
      post: "/tours/{executionId}/keypoint/{keyPointId}/notify"
      body: "*"
    };
  }

  // Dobavljanje aktivne ture za datog turistu
  rpc GetActiveTour(GetActiveTourRequest) returns (GetActiveTourResponse) {
    option (google.api.http) = {
      get: "/tours/active-tour/{touristId}"
    };
  }

  rpc HasTourExecution(HasTourExecutionRequest) returns (HasTourExecutionResponse) {
    option (google.api.http) = {
      get: "/tours/{userId}/has-tour/{tourId}"
    };
  }

  // RPC za proveru završetka ture
  rpc CheckTourCompletion(CheckTourCompletionRequest) returns (CheckTourCompletionResponse) {
    option (google.api.http) = {
      get: "/tours/{execution_id}/check-completion"
    };
  }
}

// Zahtev je prazan
message GetPublishedToursRequest {}

// Odgovor sadrži listu tura
message GetPublishedToursResponse {
  repeated PublishedTour tours = 1;
}

// Poruka koja sadrži sve što frontend očekuje
message PublishedTour {
  string id = 1;
  string name = 2;
  double price = 3;
  string description = 4;
  double length = 5;
  string startTime = 6;
  repeated KeyPoint keyPoints = 7;
}

// ----------------- TOURS PORUKE -----------------

// Tura
message TourResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string difficulty = 4;
  repeated string tags = 5;
  string status = 6;
  double price = 7;
  string authorId = 8;
  repeated KeyPoint keyPoints = 9;
  double averageRating = 10; // Ostaje jer se dobija iz ReviewService
}

// Kreiranje ture
message CreateTourRequest {
  string name = 1;
  string description = 2;
  string difficulty = 3;
  repeated string tags = 4;
  string status = 5;
  double price = 6;
  string authorId = 7;
}

// Zahtev za listu tura autora
message GetAuthorToursRequest {
  string authorId = 1;
}

// Odgovor sa listom tura
message GetAuthorToursResponse {
  repeated TourResponse tours = 1;
}

message GetTourByIdRequest {
  string id = 1;
}

// ----------------- KLJUČNE TAČKE -----------------
message KeyPoint {
  string id = 1;
  string name = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  string imageURL = 6; 
  int32 order = 7;
}

message AddKeyPointRequest {
  string tourId = 1;
  KeyPoint point = 2;
}

message KeyPointResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  double latitude = 4;
  double longitude = 5;
  string imageURL = 6;
  int32 order = 7;
}

message UpdateKeyPointRequest {
  string tourId = 1;
  KeyPoint keyPoint = 2;
  string imageURL = 3;
}

message DeleteKeyPointRequest {
  string tourId = 1;
  string keypointId = 2;
}

message DeleteKeyPointResponse {
  bool success = 1;
}

// Zahtev može biti prazan
message GetAllToursRequest {}

// Odgovor sadrži listu svih tura
message GetAllToursResponse {
  repeated PublishedTour tours = 1;
}

message StartTourRequest {
  string tourId = 1;
  string userId = 2;
}

// Odgovor sadrži ID kreirane sesije i status
message StartTourResponse {
  string tourExecutionId = 1;
  string status = 2; // ACTIVE
}

message LeaveTourRequest {
  string tourExecutionId = 1;
  string userId = 2;
}

message LeaveTourResponse {
  string status = 1; // ABANDONED
}

message NotifyNearKeyPointRequest {
  string executionId = 1;
  string keyPointId = 2;
  string userId = 3;
}

message NotifyNearKeyPointResponse {
  bool success = 1;
  string message = 2; // opcionalno, npr. "User notified successfully"
}


// Zahtev sadrži samo ID turiste
message GetActiveTourRequest {
  string touristId = 1;
}

// Odgovor vraća aktivnu turu, može biti prazan ako nema ACTIVE ture
message GetActiveTourResponse {
  string executionId = 1; // ID TourExecution objekta
  string tourId = 2;      // ID ture
  string status = 3;      // ACTIVE
}


// Provera da li korisnik ima aktivnu turu
message HasTourExecutionRequest {
  string userId = 1;
  string tourId = 2;
}

message HasTourExecutionResponse {
  bool hasExecution = 1;
}

// Request sadrži samo executionId
message CheckTourCompletionRequest {
  string execution_id = 1;
}

// Response vraća da li je tura završena
message CheckTourCompletionResponse {
  bool completed = 1;
}